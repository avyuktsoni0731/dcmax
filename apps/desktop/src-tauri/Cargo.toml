[package]
name = "mycord-desktop"
version = "0.1.0"
edition = "2021"
description = "MyCord desktop shell"

[lib]
name = "mycord_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
native-sender = { path = "../../native-sender" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[patch.crates-io]
webrtc-sys = { path = "../../native-sender/vendor/webrtc-sys" }
