[package]
name = "native-sender"
version = "0.1.0"
edition = "2021"

[lib]
name = "native_sender"
path = "src/lib.rs"

[[bin]]
name = "native-sender"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
if-addrs = "0.13"
livekit = { version = "0.10", features = ["rustls-tls-native-roots"] }
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
softbuffer = "0.4"
winit = "0.30"
cpal = "0.15"
opusic-sys = { version = "0.7", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
eframe = "0.31"
nnnoiseless = "0.5"

[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
screencapturekit = { version = "11", features = ["macos_14_0", "macos_15_0"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-capture = "2.0.1"
openh264 = { version = "0.8", default-features = false, features = ["source"] }

[build-dependencies]
cc = "1"
